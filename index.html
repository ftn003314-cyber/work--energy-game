<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسحبي الإجابة وابدئي شغلاً!</title>
<style>
:root{--bg:#eaf4fa;--ink:#1d2b3a;--wood1:#c98f55;--wood2:#a86b34;--wood3:#7a4a20;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(circle at 20% 0,#fff 0,var(--bg) 60%);color:var(--ink);font-family:Tahoma,"Segoe UI","Geeza Pro","Arial",sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:760px;margin:0 auto;padding:12px}
h1{margin:6px 0 2px;text-align:center;font-size:clamp(22px,5vw,32px);color:var(--wood3)}
.sub{text-align:center;margin:0 0 10px;color:#52667a;font-size:14px}
.stats{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
.stats div{background:#fff;border:2px solid #cfe0ec;border-radius:14px;padding:6px 14px;font-weight:700;font-size:15px}
.stats b{color:var(--wood2);font-size:20px;margin:0 4px}
#fb{min-height:30px;text-align:center;font-weight:700;font-size:16px;margin-bottom:6px;transition:color .2s}
.heads{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-weight:800;text-align:center;color:var(--wood3);margin-bottom:4px}
.board{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
.qb{position:relative;display:flex;align-items:center;gap:10px;min-height:76px;padding:8px 10px;border-radius:12px;color:#fff;cursor:pointer;
background:repeating-linear-gradient(95deg,rgba(255,255,255,.07) 0 6px,rgba(0,0,0,.05) 6px 12px),linear-gradient(180deg,var(--wood1),var(--wood2));border:3px solid var(--wood3);box-shadow:0 4px 0 var(--wood3);transition:transform .15s,box-shadow .15s}
.qb.sel{outline:4px solid #fde047;transform:translateY(-2px)}
.qb.over{outline:4px dashed #fff;transform:scale(1.03)}
.qb.ok{background:linear-gradient(180deg,#34d399,#16a34a);border-color:#0b6b30;box-shadow:0 4px 0 #0b6b30;cursor:default}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--wood3);display:grid;place-items:center;font-weight:800;font-size:18px}
.qt{flex:1;font-size:clamp(14px,3.4vw,17px);font-weight:700;line-height:1.5}
.got{display:none;margin-top:4px;background:#fff;color:#0b6b30;border-radius:8px;padding:2px 10px;font-weight:800;direction:ltr;width:max-content;max-width:100%}
.qb.ok .got{display:block}
.hint{flex:none;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;align-self:flex-start}
.ht{display:none;font-size:13px;margin-top:4px;background:rgba(0,0,0,.22);border-radius:8px;padding:3px 8px}
.ht.on{display:block}
.qb.ok .hint,.qb.ok .ht{display:none}
.ar{position:relative;display:flex;align-items:center;justify-content:center;min-height:76px;padding:6px 26px 6px 30px;color:#fff;font-weight:800;font-size:clamp(15px,3.6vw,19px);background:var(--c);
clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;text-align:center;line-height:1.3}
.ar bdi{unicode-bidi:isolate}
.ar.sel{filter:brightness(1.15) saturate(1.2);transform:translateX(6px)}
.ar.drag{opacity:.35}
.ar.done{visibility:hidden}
.ar.shake,.qb.shake{animation:sh .4s}
.ghost{position:fixed;z-index:99;pointer-events:none;width:170px;min-height:64px;opacity:.95;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pf{position:absolute;pointer-events:none;font-size:22px;animation:pf .9s forwards}
@keyframes pf{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-46px) scale(1.4)}}
#end{display:none;text-align:center;padding:30px 10px}
#end .big{font-size:72px}
#end h2{margin:6px 0;font-size:28px;color:var(--wood3)}
#end .sc{font-size:46px;font-weight:800;color:var(--ok)}
.btn{background:var(--wood2);color:#fff;border:0;border-radius:14px;padding:12px 28px;font:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--wood3);margin-top:12px}
.btn.s{padding:8px 18px;font-size:15px;margin:0}
.top{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<h1>اسحبي الإجابة وابدئي شغلاً!</h1>
<p class="sub">اسحبي السهم الملوّن إلى صندوق السؤال المناسب، أو اضغطي السؤال ثم الإجابة</p>
<div id="play">
  <div class="stats"><div>النقاط<b id="sc">0</b>/ 6</div><div>المتبقي<b id="rm">6</b></div></div>
  <div id="fb"></div>
  <div class="heads"><div>(أ) الأسئلة</div><div>(ب) الإجابات</div></div>
  <div class="board"><div class="col" id="qc"></div><div class="col" id="ac"></div></div>
  <div class="top" style="margin-top:14px"><button class="btn s" id="rs">🔀 إعادة الخلط</button></div>
</div>
<div id="end">
  <div class="big" id="em">🏆</div>
  <h2 id="msg"></h2>
  <div class="sc"><span id="fs">0</span> / 6</div>
  <p id="fm" style="color:#52667a"></p>
  <button class="btn" id="again">🔁 العبي مرة أخرى</button>
</div>
</div>
<script>
(function(){
var Q=[
{q:"ما رمز الشغل؟",a:"W",h:"يأتي من الكلمة الإنجليزية Work."},
{q:"ما وحدة قياس الشغل في النظام الدولي؟",a:"J",h:"سُميت تكريمًا للعالم جول."},
{q:"ما قانون الشغل عندما تكون القوة موازية للإزاحة؟",a:"W = Fd",h:"الشغل يساوي القوة × الإزاحة."},
{q:"إذا كانت القوة عمودية على الإزاحة (θ = 90°)، فكم يكون الشغل؟",a:"صفر",h:"تذكّري: cos 90° = 0."},
{q:"إذا كانت القوة بعكس اتجاه الإزاحة فإن الشغل يكون؟",a:"سالبًا",h:"الزاوية 180° وقيمة cos 180° سالبة."},
{q:"ما العلاقة بين الشغل والتغير في الطاقة الحركية؟",a:"W = ΔKE",h:"نظرية الشغل والطاقة."}];
var C=["#e11d48","#2563eb","#d97706","#7c3aed","#0d9488","#ea580c"];
var $=function(i){return document.getElementById(i)};
var matched,wrong,score,selQ,selA,order,drag;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function shuffle(){ /* ترتيب عشوائي بحيث لا تقع أي إجابة بجانب سؤالها */
 var o,ok;
 do{o=[0,1,2,3,4,5];for(var i=5;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=o[i];o[i]=o[j];o[j]=t}
  ok=true;for(var p=0;p<6;p++)if(o[p]===p)ok=false}while(!ok);
 return o}
function start(){
 matched=[0,0,0,0,0,0];wrong=[0,0,0,0,0,0];score=0;selQ=selA=null;order=shuffle();
 $("end").style.display="none";$("play").style.display="block";$("fb").textContent="";
 $("qc").innerHTML=Q.map(function(x,i){return '<div class="qb" data-i="'+i+'"><span class="num">'+(i+1)+'</span><div class="qt">'+esc(x.q).replace("θ = 90°","<bdi>θ = 90°</bdi>")+'<div class="ht" id="h'+i+'">💡 '+esc(x.h)+'</div><div class="got"></div></div><button class="hint" data-h="'+i+'" aria-label="تلميح">💡</button></div>'}).join("");
 $("ac").innerHTML=order.map(function(id){return '<div class="ar" data-a="'+id+'" style="--c:'+C[id]+'"><bdi>'+esc(Q[id].a)+'</bdi></div>'}).join("");
 upd()}
function upd(){$("sc").textContent=score;$("rm").textContent=6-matched.reduce(function(a,b){return a+b},0)}
function fb(t,c){var e=$("fb");e.textContent=t;e.style.color=c}
function burst(el){var e=["✨","⭐","🎉"];for(var k=0;k<3;k++){var s=document.createElement("span");s.className="pf";s.textContent=e[k];s.style.left=(20+k*30)+"%";s.style.top="0";el.appendChild(s);setTimeout(function(n){return function(){n.remove()}}(s),950)}}
function clearSel(){selQ=selA=null;document.querySelectorAll(".sel").forEach(function(e){e.classList.remove("sel")})}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function attempt(q,a){
 q=+q;a=+a;var qb=document.querySelector('.qb[data-i="'+q+'"]'),ar=document.querySelector('.ar[data-a="'+a+'"]');
 if(matched[q]||ar.classList.contains("done")){clearSel();return}
 if(a===q){ /* التحقق بالمعرّف الداخلي وليس بترتيب الظهور */
  matched[q]=1;if(!wrong[q])score++;
  qb.classList.add("ok");qb.classList.remove("sel");qb.querySelector(".got").innerHTML="<bdi>"+esc(Q[a].a)+"</bdi>";
  ar.classList.add("done");burst(qb);fb("✅ إجابة صحيحة! أحسنتِ","#16a34a");upd();clearSel();
  if(matched.every(function(m){return m}))setTimeout(finish,900);
 }else{
  wrong[q]=1;shake(qb);shake(ar);fb("❌ حاولي مرة أخرى","#dc2626");clearSel()}
}
function finish(){
 $("play").style.display="none";$("end").style.display="block";$("fs").textContent=score;
 var m=score===6?["🏆","ممتازة! أنتِ بطلة الشغل"]:score>=4?["🌟","رائعة! قريبة جدًا من الإتقان"]:["💪","محاولة جيدة، أعيدي اللعب وستتحسنين"];
 $("em").textContent=m[0];$("msg").textContent=m[1];
 $("fm").textContent="الدرجة تُحسب للإجابات الصحيحة من أول محاولة لكل سؤال"}
$("qc").addEventListener("click",function(e){
 var h=e.target.closest(".hint");if(h){$("h"+h.dataset.h).classList.toggle("on");return}
 var qb=e.target.closest(".qb");if(!qb||qb.classList.contains("ok"))return;
 document.querySelectorAll(".qb.sel").forEach(function(x){x.classList.remove("sel")});
 selQ=+qb.dataset.i;qb.classList.add("sel");if(selA!==null)attempt(selQ,selA)});
$("ac").addEventListener("pointerdown",function(e){
 var ar=e.target.closest(".ar");if(!ar||ar.classList.contains("done"))return;
 drag={ar:ar,id:+ar.dataset.a,x:e.clientX,y:e.clientY,g:null,pid:e.pointerId};
 try{ar.setPointerCapture(e.pointerId)}catch(x){}});
function under(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest(".qb"):null}
document.addEventListener("pointermove",function(e){
 if(!drag||e.pointerId!==drag.pid)return;
 if(!drag.g&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
  drag.g=drag.ar.cloneNode(true);drag.g.className="ar ghost";drag.g.style.setProperty("--c",C[drag.id]);document.body.appendChild(drag.g);drag.ar.classList.add("drag")}
 if(drag.g){drag.g.style.left=(e.clientX-85)+"px";drag.g.style.top=(e.clientY-32)+"px";
  document.querySelectorAll(".qb.over").forEach(function(x){x.classList.remove("over")});
  var q=under(e.clientX,e.clientY);if(q&&!q.classList.contains("ok"))q.classList.add("over")}});
function endDrag(e,cancel){
 if(!drag||e.pointerId!==drag.pid)return;
 var d=drag;drag=null;document.querySelectorAll(".qb.over").forEach(function(x){x.classList.remove("over")});
 d.ar.classList.remove("drag");
 if(d.g){d.g.remove();if(!cancel){var q=under(e.clientX,e.clientY);if(q)attempt(q.dataset.i,d.id)}}
 else if(!cancel){ /* ضغطة بدون سحب = اختيار السهم */
  var was=d.ar.classList.contains("sel");document.querySelectorAll(".ar.sel").forEach(function(x){x.classList.remove("sel")});
  if(was){selA=null}else{selA=d.id;d.ar.classList.add("sel");if(selQ!==null)attempt(selQ,selA)}}}
document.addEventListener("pointerup",function(e){endDrag(e,false)});
document.addEventListener("pointercancel",function(e){endDrag(e,true)});
$("rs").onclick=start;$("again").onclick=start;
start();
})();
</script>
</body>
</html>
